<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- 元禄模様（襷掛け）のパターン - ファビコン用に簡略化 -->
    <pattern id="genroku-favicon" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="white"/>
      <rect x="0" y="0" width="5" height="12" fill="#808080"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="64" height="64" fill="#7c3aed" rx="8"/>

  <!-- 勝負服の簡略版 -->
  <g transform="translate(12, 8)">
    <!-- 胴体（元禄模様） -->
    <path d="M 8,8 L 6,14 L 6,36 C 6,38 8,40 10,42 L 30,42 C 32,40 34,38 34,36 L 34,14 L 32,8 Z"
          fill="url(#genroku-favicon)"
          stroke="#333"
          stroke-width="1.5"/>

    <!-- 左袖（グレー） -->
    <path d="M 6,14 L 2,18 L 1,28 L 4,30 L 6,28 Z"
          fill="#808080"
          stroke="#333"
          stroke-width="1.5"/>

    <!-- 右袖（グレー） -->
    <path d="M 34,14 L 38,18 L 39,28 L 36,30 L 34,28 Z"
          fill="#808080"
          stroke="#333"
          stroke-width="1.5"/>

    <!-- 襟のハイライト -->
    <path d="M 8,8 L 12,10 L 12,14 L 8,12 Z" fill="white" opacity="0.8"/>
    <path d="M 32,8 L 28,10 L 28,14 L 32,12 Z" fill="white" opacity="0.8"/>

    <!-- センターライン（ボタンの代わり） -->
    <line x1="20" y1="12" x2="20" y2="30" stroke="#333" stroke-width="1.5"/>
  </g>
</svg>
